version: 2
project_name: "sigillum"
force_token: gitlab
before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: sigillum
    # The PACKAGE, not cmd/sigillum/main.go. `go build <file>` compiles that
    # file alone, so every other `package main` file in the directory is
    # silently excluded — and this package has three: signing.go, which
    # registers the AWS KMS and local signing backends, encryption.go, and
    # keychain.go.
    #
    # Without them, `sigillum sign` fails with "no backends are registered"
    # — every published binary to date. It went unnoticed because the only
    # consumer installs with `go install`, which builds the package.
    #
    # See issue #10, and go-tool-base #79 for the generator fix.
    main: ./cmd/sigillum
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X gitlab.com/phpboyscout/sigillum/internal/version.version={{.Version}}
      - -X gitlab.com/phpboyscout/sigillum/internal/version.commit={{.Commit}}
      - -X gitlab.com/phpboyscout/sigillum/internal/version.date={{.Date}}

# macOS notarization — gated on the Apple credentials (root-group CI vars,
# inherited and exposed on the protected v* tag). Skips cleanly when absent.
notarize:
  macos:
    - enabled: '{{ isEnvSet "APPLE_DEV_CERT" }}'
      ids:
        - sigillum
      sign:
        certificate: "{{.Env.APPLE_DEV_CERT}}"
        password: "{{.Env.APPLE_DEV_CERT_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.APPLE_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.APPLE_NOTARY_KEY_ID}}"
        key: "{{.Env.APPLE_NOTARY_KEY}}"

archives:
  - formats: [ "tar.gz" ]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

# goreleaser BUILDS and UPLOADS; it does not own the release.
#
# colophon creates the release on the tag pipeline, after this job, carrying
# links to what was uploaded here (colophon spec 0004), which also closes the
# gap the old keep-existing mode relied on runner latency to cover. `disable`
# rather than `skip_upload`: the upload still happens, through `blobs`, which
# needs no release to exist.
release:
  disable: true

# The release store (colophon spec 0025). `directory` is the tag and must agree
# with the cicd colophon component's `asset_base`: written twice on purpose, so
# a mismatch is a visible configuration error rather than a release full of
# 404s. Every object is write-once, hence immutable (0025 D18).
blobs:
  - provider: s3
    bucket: pbs-release-binaries
    endpoint: "{{ .Env.R2_RELEASE_ENDPOINT }}"
    region: auto
    directory: "sigillum/{{ .Tag }}"
    s3_force_path_style: true
    content_disposition: inline
    cache_control:
      - "public, max-age=31536000, immutable"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-dev{{.ShortCommit}}"

changelog:
  # colophon owns the changelog and Release notes.
  disable: true

gitlab_urls:
  api: https://gitlab.com/api/v4/
  download: https://gitlab.com/
  skip_tls_verify: false

# Release signing: gtb enable signing wired this. The signature over
# checksums.txt is what the self-updater's embedded trust anchor verifies.
# gtb is called directly (no shim); AWS credentials come from the CI OIDC
# context, and goreleaser runs with --skip=sign when there isn't one.
signs:
  # sigillum dogfoods its own sign command (backends blank-imported in
  # cmd/sigillum/signing.go). `go run` builds a throwaway signer at release
  # time; the AWS OIDC env from the tag pipeline drives the aws-kms backend.
  - id: checksums
    cmd: go
    # The R2 keys the process carries for `blobs` outrank the OIDC identity in
    # the SDK's chain, so they are blanked for the signer (0025 D15).
    env:
      - "AWS_ACCESS_KEY_ID="
      - "AWS_SECRET_ACCESS_KEY="
    args:
      - "run"
      - "./cmd/sigillum"
      - "--ci"
      - "sign"
      - "--backend"
      - "aws-kms"
      - "--kms-region"
      - "eu-west-2"
      - "--key-id"
      - "alias/gtb-release-signing-v2"
      - "--public-key"
      - "internal/trustkeys/keys/signing-key-v2.asc"
      - "--output"
      - "${signature}"
      - "${artifact}"
    artifacts: checksum
    signature: "${artifact}.sig"
    output: true
