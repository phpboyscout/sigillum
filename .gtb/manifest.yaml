commands:
  - name: decrypt
    description: Decrypt an OpenPGP message addressed to a KMS-backed certificate
    long_description: Decrypt an OpenPGP message addressed to a KMS-backed certificate
    hashes:
      cmd.go: ccc66182ca899212acb4c4de5d501ee59b828933d4cbf11b77ada0d966f85fd2
    protected: false
    flags:
      - name: certificate
        type: string
        description: Path to the recipient certificate, or '-' for stdin
      - name: key
        type: string
        description: Key service identifier for the encryption subkey
      - name: backend
        type: string
        description: Key service backend to use
      - name: output
        type: string
        description: Write plaintext here instead of stdout
      - name: follow-symlinks
        type: bool
        description: Write through a symbolic link named by --output instead of refusing it
  - name: certificate
    description: Assemble and emit an OpenPGP certificate backed by key-service keys
    long_description: Assemble and emit an OpenPGP certificate backed by key-service keys
    hashes:
      cmd.go: 5b0be342a564d10be3510068258e6f741dd1384ae046910d4363e611351c16b3
    protected: true
    flags:
      - name: user-id
        type: string
        description: Identity to certify, as 'Name <email>'
      - name: certify-key
        type: string
        description: Key service identifier for the certification primary
      - name: encrypt-key
        type: string
        description: Key service identifier for the encryption subkey
      - name: backend
        type: string
        description: Key service backend to use
      - name: created
        type: string
        description: Key creation time as RFC 3339; must not change between runs
      - name: armor
        type: bool
        description: Emit ASCII armour instead of binary
      - name: signed-at
        type: string
        description: Signature time as RFC 3339; defaults to now, and is logged so it can be supplied again
      - name: reproducible
        type: bool
        description: Emit a byte-identical certificate across runs; requires --signed-at and disables the random salt
      - name: output
        type: string
        description: Write the certificate here instead of stdout
      - name: follow-symlinks
        type: bool
        description: Write through a symbolic link named by --output instead of refusing it
  - name: sign
    description: Produce a detached signature over a file using a configured backend
    args: ExactArgs(1)
    hashes:
      cmd.go: ""
    protected: true
    commands:
      - name: image
        description: Sign a container image by digest, in both cosign signature forms
        args: ExactArgs(1)
        hashes:
          cmd.go: ""
        protected: true
  - name: keys
    description: Manage OpenPGP keys for release-binary signing
    hashes:
      cmd.go: ""
    protected: true
    commands:
      - name: mint
        description: Mint an ASCII-armored OpenPGP public key from an existing signer
        hashes:
          cmd.go: ""
        protected: true
      - name: generate
        description: Generate a fresh keypair locally (Ed25519 or RSA) and emit both halves
        hashes:
          cmd.go: ""
        protected: true
      - name: wkd
        description: Generate a Web Key Directory tree from one or more public keys
        args: MinimumNArgs(1)
        hashes:
          cmd.go: ""
        protected: true
      - name: minisign
        description: Emit the minisign public key for an Ed25519 signer
        hashes:
          cmd.go: ""
        protected: true
      - name: publish
        description: Stage a minisign public key into a keys site with a manifest
        args: ExactArgs(1)
        hashes:
          cmd.go: ""
        protected: true
      - name: generate-image
        description: Generate an ECDSA P-256 keypair for image signing
        args: NoArgs
        hashes:
          cmd.go: ""
        protected: true
      - name: rotate
        description: Issue a signed rotation manifest for a project's release keys
        args: NoArgs
