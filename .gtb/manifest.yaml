properties:
  name: sigillum
  description: Standalone artefact signing and verification CLI for the phpboyscout ecosystem
  features:
    - name: config
      enabled: true
    - name: gitlab
      enabled: true
    - name: init
      enabled: false
    - name: keychain
      enabled: true
    - name: mcp
      enabled: false
  signing:
    enabled: true
    require_signature: true
    key_source: embedded
    backend: aws-kms
    key_id: alias/gtb-release-signing-v2
    kms_region: eu-west-2
    public_key: internal/trustkeys/keys/signing-key-v2.asc
  module_path: gitlab.com/phpboyscout/sigillum
  docs_layout: diataxis
release_source:
  type: gitlab
  backend: gitlab
  host: gitlab.com
  owner: phpboyscout
  repo: sigillum
version:
