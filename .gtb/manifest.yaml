commands:
  - name: decrypt
    description: Decrypt an OpenPGP message addressed to a KMS-backed certificate
    long_description: Decrypt an OpenPGP message addressed to a KMS-backed certificate
    hashes:
      cmd.go: ccc66182ca899212acb4c4de5d501ee59b828933d4cbf11b77ada0d966f85fd2
    protected: false
    flags:
      - name: certificate
        type: string
        description: Path to the recipient certificate, or '-' for stdin
      - name: key
        type: string
        description: Key service identifier for the encryption subkey
      - name: backend
        type: string
        description: Key service backend to use
      - name: output
        type: string
        description: Write plaintext here instead of stdout
      - name: follow-symlinks
        type: bool
        description: Write through a symbolic link named by --output instead of refusing it
  - name: certificate
    description: Assemble and emit an OpenPGP certificate backed by key-service keys
    long_description: Assemble and emit an OpenPGP certificate backed by key-service keys
    hashes:
      cmd.go: 5b0be342a564d10be3510068258e6f741dd1384ae046910d4363e611351c16b3
    protected: true
    flags:
      - name: user-id
        type: string
        description: Identity to certify, as 'Name <email>'
      - name: certify-key
        type: string
        description: Key service identifier for the certification primary
      - name: encrypt-key
        type: string
        description: Key service identifier for the encryption subkey
      - name: backend
        type: string
        description: Key service backend to use
      - name: created
        type: string
        description: Key creation time as RFC 3339; must not change between runs
      - name: armor
        type: bool
        description: Emit ASCII armour instead of binary
      - name: signed-at
        type: string
        description: Signature time as RFC 3339; defaults to now, and is logged so it can be supplied again
      - name: reproducible
        type: bool
        description: Emit a byte-identical certificate across runs; requires --signed-at and disables the random salt
      - name: output
        type: string
        description: Write the certificate here instead of stdout
      - name: follow-symlinks
        type: bool
        description: Write through a symbolic link named by --output instead of refusing it
