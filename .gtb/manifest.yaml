properties:
  name: sigillum
  description: Standalone artefact signing and verification CLI for the phpboyscout ecosystem
  features:
    - name: config
      enabled: true
    - name: keychain
      enabled: true
    - name: mcp
      enabled: false
    - name: init
      enabled: false
  signing:
    enabled: true
    key_source: embedded
    backend: aws-kms
    key_id: alias/gtb-release-signing-v2
    kms_region: eu-west-2
    public_key: internal/trustkeys/keys/signing-key-v2.asc
  docs_layout: diataxis
  external_commands:
    - module: gitlab.com/phpboyscout/go/signing-cli
      version: v0.4.1
      attach:
        - constructor: NewCmdSign
          args:
            - logger
          wrap: true
        - constructor: NewCmdKeys
          args:
            - logger
          wrap: true
release_source:
  type: gitlab
  host: gitlab.com
  owner: phpboyscout
  repo: sigillum
version:
