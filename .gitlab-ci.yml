# .gitlab-ci.yml — pipeline assembled from phpboyscout/cicd components.
#
#   merge_request_event → lint, test, security        (the merge gate)
#   tag v*.*.*          → goreleaser, pages docs       (the release fan-out)
#   default branch      → releaser-pleaser, zensical-pages deploy
#
# Quality gates live exclusively at the MR level — pushing to the default
# branch runs nothing except releaser-pleaser (which itself opens an MR that
# gets the full gate), so by the time anything lands it has already been
# vetted. Goreleaser and the zensical-pages deploy both fire from the tag
# releaser-pleaser cuts when its Release MR merges, which means the docs site
# always corresponds to a real tagged release.
#
# Project setting prerequisites (configure these on the GitLab project before
# the pipeline can function):
#   • RELEASER_PLEASER_TOKEN — a project access token with the Maintainer
#     role and the api, read_repository, write_repository scopes, set as a
#     CI/CD variable. releaser-pleaser uses it to open/update the Release MR
#     and cut the tag. The component does not support floating tags.
#   • Merge method: fast-forward + squash (so the tested commit is what lands
#     on the default branch).
#   • Pipelines must succeed (so the MR gates actually block merge).
#
# The phpboyscout/cicd components are version-pinned below. Renovate keeps the
# pins current via the cicd preset extended in renovate.json — driven by the
# group-wide autodiscover bot in phpboyscout/cicd, so this repo needs neither a
# renovate-self include nor its own pipeline schedule. Bump deliberately
# through the Renovate MRs rather than floating the tags.

include:
  # Quality gates — MR-only by default. Toolchain images are left at the
  # component defaults; let Renovate/cicd carry the toolchain rather than
  # pinning point-in-time overrides here.
  - component: gitlab.com/phpboyscout/cicd/go-lint@v0.34.1
  - component: gitlab.com/phpboyscout/cicd/go-test@v0.34.1
    inputs:
      # The Godog suite in test/e2e drives the BUILT binary — the only
      # place sigillum's own risk lives, since it is a thin shell over
      # go/signing-cli. A library-level test cannot see which stream a
      # value lands on.
      enable_e2e: true
      e2e_timeout: "10m"
  - component: gitlab.com/phpboyscout/cicd/go-security@v0.34.1

  # Release — tag-gated goreleaser + default-branch zensical-pages deploy.
  - component: gitlab.com/phpboyscout/cicd/goreleaser@v0.34.1
  - component: gitlab.com/phpboyscout/cicd/zensical-pages@v0.34.1

  # Release MR machinery — the phpboyscout wrapper, NOT apricote's component
  # directly. The wrapper leads its rules with a schedule-never guard (the
  # upstream component gates only on the branch name, so it also fires on
  # scheduled pipelines running against the default branch), and it adds
  # releaser-pleaser:verify, which keeps the Release MR squashing on merge so
  # the tag cannot land on a commit that is not on the release branch.
  # See phpboyscout/cicd issue #7 and wiki spec 0061.
  - component: gitlab.com/phpboyscout/cicd/releaser-pleaser@v0.34.1
    inputs:
      token: $RELEASER_PLEASER_TOKEN
      branch: main
      stage: release

stages:
  - lint
  - test
  - security
  - release
  - pages

# Pipeline-source gating: MR pipelines are primary; tag pipelines run the
# release fan-out; default-branch pipelines exist only so releaser-pleaser can
# maintain its MR. The `never` rule suppresses duplicate branch pipelines when
# a feature branch already has an open MR (otherwise every push to a branch
# with an open MR would build twice).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

variables:
  # releaser-pleaser + goreleaser walk the full commit history.
  GIT_DEPTH: "0"

# Release signing (OIDC). The goreleaser `signs:` block calls
# `go run ./cmd/sigillum sign --backend aws-kms`, which the aws-kms backend
# drives via GitLab->AWS web-identity OIDC — no aws-cli or assume-role call.
# sigillum signs with the SHARED v2 release-signing key (same trust root as
# go-tool-base); the v2 signer role trusts this project's tag pipelines via
# ci_subject_filters in infra/src/main.signing-kms.tf.
#
# DORMANT until infra MR (sigillum -> v2 role) is applied: a v* tag pipeline
# cut before then will fail the sign step (no assumable role). Apply the infra
# change first, then cut the release.
goreleaser:
  id_tokens:
    AWS_WEB_IDENTITY_TOKEN:
      # Must equal the IAM OIDC provider's client_id_list entry
      # ("sts.amazonaws.com") — checked before the role trust policy. The v2
      # role's oidc_audience is matched to this.
      aud: sts.amazonaws.com
  variables:
    AWS_REGION: eu-west-2
    AWS_ROLE_ARN: arn:aws:iam::060730976733:role/gtb-release-signing-v2-signer
    AWS_ROLE_SESSION_NAME: sigillum-release-${CI_COMMIT_TAG}
    # In variables: (not just an export) because GitLab runs each script entry
    # in its own shell.
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/oidc-token
  before_script:
    - echo "$AWS_WEB_IDENTITY_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
